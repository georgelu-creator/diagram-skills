<g class="edge-label-group"><rect class="edge-label-bg" x="1270.65" y="180" width="58.1" height="20" rx="7"/><text class="edge-label" x="1299.7" y="190">signals</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="1273.75" y="243.5" width="58.1" height="20" rx="7"/><text class="edge-label" x="1302.8" y="253.5">context</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="1606.5" y="205" width="64.4" height="20" rx="7"/><text class="edge-label" x="1638.7" y="215">decision</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="950.7" y="348" width="64.4" height="20" rx="7"/><text class="edge-label" x="982.9" y="358">feedback</text></g>
