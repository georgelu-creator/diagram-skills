<g class="node" id="node-stream"><rect class="node-shape process" x="1018.2" y="118" width="219.4" height="78" rx="13"/><text class="node-title" x="1127.9" y="147">实时计算</text><text class="node-subtitle" x="1127.9" y="169">Window · Enrich · Feature</text></g>
<g class="node" id="node-lakehouse"><path class="node-shape database" d="M 1012 252 C 1012 238 1243.8 238 1243.8 252 V 316 C 1243.8 330 1012 330 1012 316 Z"/><ellipse class="node-detail" cx="1127.9" cy="252" rx="115.9" ry="12"/><text class="node-title" x="1127.9" y="277">Lakehouse</text><text class="node-subtitle" x="1127.9" y="299">History · Replay · Training</text></g>
