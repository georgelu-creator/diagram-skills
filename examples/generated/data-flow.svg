<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 1243.8 284 L 1302.8 284 L 1302.8 223 L 1361.8 223" marker-end="url(#arrow-primary)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 1550.2 223 L 1609.2 223 L 1668.2 223" marker-end="url(#arrow-primary)"/>
<path class="edge feedback" style="stroke:var(--edge-feedback)" stroke-width="2.1" stroke-dasharray="10 4" d="M 1893.8 223 L 1921.8 223 L 1921.8 366 L 44 366 L 44 223 L 72 223" marker-end="url(#arrow-feedback)"/>
<g class="node" id="node-events"><rect class="node-shape external" x="72" y="184" width="188" height="78" rx="13"/><text class="node-title" x="166" y="213">业务事件</text><text class="node-subtitle" x="166" y="235">App · Web · Device</text></g>
