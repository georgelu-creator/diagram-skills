<svg xmlns="http://www.w3.org/2000/svg" class="diagram-skills" data-theme="light" viewBox="0 0 960 714" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">AI 产品能力地图</title><desc id="diagram-desc">产品能力地图 / Capability Map with 7 nodes and 6 edges</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="var(--shadow)"/></filter>
<marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-primary)"/></marker>
<marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-control)"/></marker>
<marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-feedback)"/></marker>
<marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-async)"/></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-success)"/></marker>
<marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-error)"/></marker>
</defs>
<style>
.diagram-skills{--page:#ffffff;--surface:#ffffff;--ink:#172033;--muted:#526071;--hair:#d7e0ea;--group:#f8fafc;--group_stroke:#c7d2e0;--shadow:#31537a18;--node-process:#eff6ff;--node-process-stroke:#60a5fa;--node-decision:#fff7ed;--node-decision-stroke:#fb923c;--node-input:#fdf4ff;--node-input-stroke:#d946ef;--node-document:#f0fdf4;--node-document-stroke:#4ade80;--node-database:#ecfeff;--node-database-stroke:#22d3ee;--node-agent:#f5f3ff;--node-agent-stroke:#8b5cf6;--node-external:#f8fafc;--node-external-stroke:#94a3b8;--group-tone-0:#eff6ff;--group-tone-1:#ecfeff;--group-tone-2:#f5f3ff;--group-tone-3:#fff7ed;--group-tone-4:#f0fdf4;--group-tone-5:#fff1f2;--edge-primary:#2563eb;--edge-control:#ea580c;--edge-feedback:#7c3aed;--edge-async:#64748b;--edge-success:#059669;--edge-error:#dc2626;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page)}}
.diagram-skills[data-theme="dark"]{--page:#0c1117;--surface:#151b23;--ink:#f8fafc;--muted:#a8b3c2;--hair:#334155;--group:#16253a;--group_stroke:#42648f;--shadow:#00000055;--node-process:#151b23;--node-process-stroke:#334155;--node-decision:#151b23;--node-decision-stroke:#334155;--node-input:#151b23;--node-input-stroke:#334155;--node-document:#151b23;--node-document-stroke:#334155;--node-database:#151b23;--node-database-stroke:#334155;--node-agent:#151b23;--node-agent-stroke:#334155;--node-external:#151b23;--node-external-stroke:#334155;--group-tone-0:#16253a;--group-tone-1:#16253a;--group-tone-2:#16253a;--group-tone-3:#16253a;--group-tone-4:#16253a;--group-tone-5:#16253a}
text{fill:var(--ink)}.page-bg{fill:var(--page)}.title{font-size:25px;font-weight:800}.subtitle{font-size:12.5px;fill:var(--muted)}.type-badge{font-size:10px;font-weight:800;fill:var(--muted);letter-spacing:.4px}.type-badge-bg{fill:var(--surface);stroke:var(--hair)}
.lane-box{fill:var(--surface);stroke:var(--hair);stroke-width:1.1}.lane:nth-child(even) .lane-box{fill:var(--group)}.lane-title{font-size:12px;font-weight:850;fill:var(--muted);letter-spacing:.45px}.group-box{fill:var(--group);stroke:var(--group-stroke);stroke-width:1.2}.group.tone-0 .group-box{fill:var(--group-tone-0)}.group.tone-1 .group-box{fill:var(--group-tone-1)}.group.tone-2 .group-box{fill:var(--group-tone-2)}.group.tone-3 .group-box{fill:var(--group-tone-3)}.group.tone-4 .group-box{fill:var(--group-tone-4)}.group.tone-5 .group-box{fill:var(--group-tone-5)}.group-title{font-size:12px;font-weight:800;fill:var(--muted);letter-spacing:.5px}
.node-shape{stroke-width:1.25;filter:url(#shadow)}.node-shape.process{fill:var(--node-process);stroke:var(--node-process-stroke)}.node-shape.decision{fill:var(--node-decision);stroke:var(--node-decision-stroke)}.node-shape.input{fill:var(--node-input);stroke:var(--node-input-stroke)}.node-shape.document{fill:var(--node-document);stroke:var(--node-document-stroke)}.node-shape.database{fill:var(--node-database);stroke:var(--node-database-stroke)}.node-shape.agent{fill:var(--node-agent);stroke:var(--node-agent-stroke);stroke-width:1.7}.node-shape.external{fill:var(--node-external);stroke:var(--node-external-stroke);stroke-dasharray:6 4}.agent-inner{fill:none;stroke:var(--node-agent-stroke);stroke-width:.8;opacity:.55}.node-detail{fill:none;stroke:var(--hair);stroke-width:1.1}
.node-title{font-size:14.5px;font-weight:750;text-anchor:middle;dominant-baseline:middle}.node-subtitle{font-size:11.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.edge{fill:none;stroke-linecap:round;stroke-linejoin:round}.edge-label-bg{fill:var(--page);stroke:var(--hair);stroke-width:.7;opacity:.97}.edge-label{font-size:10.8px;font-weight:650;text-anchor:middle;dominant-baseline:middle;fill:var(--muted)}
.legend-bg{fill:var(--surface);stroke:var(--hair)}.legend-text{font-size:10.5px;fill:var(--muted)}.node-link{cursor:pointer}.node-link:focus .node-shape,.node-link:hover .node-shape{stroke:var(--edge-primary);stroke-width:2.4}.node-link:focus{outline:none}
</style>
<rect class="page-bg" width="960" height="714"/>
<text class="title" x="72" y="48">AI 产品能力地图</text>
<text class="subtitle" x="72" y="75">从产品北极星到平台能力、用户价值与业务结果</text>
<g class="diagram-type"><rect class="type-badge-bg" x="701.6" y="31" width="186.4" height="25" rx="12.5"/><text class="type-badge" x="794.8" y="47" text-anchor="middle">产品能力地图 / Capability Map</text></g>
<g class="group tone-0"><rect class="group-box" x="337" y="80" width="286" height="140" rx="16"/><text class="group-title" x="351" y="101">北极星 / NORTH STAR</text></g>
<g class="group tone-1"><rect class="group-box" x="73.6" y="276" width="812.8" height="174" rx="16"/><text class="group-title" x="87.6" y="297">核心能力 / CORE CAPABILITIES</text></g>
<g class="group tone-2"><rect class="group-box" x="130" y="506" width="700" height="140" rx="16"/><text class="group-title" x="144" y="527">价值结果 / OUTCOMES</text></g>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 480 196 L 480 261 L 213.5 261 L 213.5 326" marker-end="url(#arrow-primary)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 480 196 L 480 263.5 L 486.2 263.5 L 486.2 331" marker-end="url(#arrow-primary)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 480 196 L 480 255 L 752.7 255 L 752.7 314" marker-end="url(#arrow-primary)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 213.5 414 L 213.5 479 L 248 479 L 248 544" marker-end="url(#arrow-primary)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 486.2 409 L 486.2 476.5 L 480 476.5 L 480 544" marker-end="url(#arrow-primary)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 752.7 426 L 752.7 485 L 712 485 L 712 544" marker-end="url(#arrow-primary)"/>
<g class="node" id="node-vision"><rect class="node-shape agent" x="361" y="118" width="238" height="78" rx="13"/><rect class="agent-inner" x="366" y="123" width="228" height="68" rx="9"/><text class="node-title" x="480" y="147">可信的智能工作平台</text><text class="node-subtitle" x="480" y="169">Fast · Contextual · Governed</text></g>
<g class="node" id="node-understand"><path class="node-shape database" d="M 97.6 338 C 97.6 324 329.4 324 329.4 338 V 402 C 329.4 416 97.6 416 97.6 402 Z"/><ellipse class="node-detail" cx="213.5" cy="338" rx="115.9" ry="12"/><text class="node-title" x="213.5" y="363">理解与检索</text><text class="node-subtitle" x="213.5" y="385">Search · Memory · Knowledge</text></g>
<g class="node" id="node-orchestrate"><rect class="node-shape process" x="373.4" y="331" width="225.6" height="78" rx="13"/><text class="node-title" x="486.2" y="360">规划与编排</text><text class="node-subtitle" x="486.2" y="382">Agent · Workflow · Tooling</text></g>
<g class="node" id="node-govern"><path class="node-shape decision" d="M 752.7 314 L 862.4 370 L 752.7 426 L 643 370 Z"/><text class="node-title" x="752.7" y="360">治理与评估</text><text class="node-subtitle" x="752.7" y="382">Permission · Eval · Audit</text></g>
<g class="node" id="node-speed"><path class="node-shape document" d="M 154 544 H 324 L 342 562 V 613 Q 248 629 154 613 Z"/><path class="node-detail" d="M 324 544 V 562 H 342"/><text class="node-title" x="248" y="573">更快完成任务</text><text class="node-subtitle" x="248" y="595">Time to value ↓</text></g>
<g class="node" id="node-quality"><path class="node-shape document" d="M 386 544 H 556 L 574 562 V 613 Q 480 629 386 613 Z"/><path class="node-detail" d="M 556 544 V 562 H 574"/><text class="node-title" x="480" y="573">更稳定的质量</text><text class="node-subtitle" x="480" y="595">Success rate ↑</text></g>
<g class="node" id="node-trust"><path class="node-shape document" d="M 618 544 H 788 L 806 562 V 613 Q 712 629 618 613 Z"/><path class="node-detail" d="M 788 544 V 562 H 806"/><text class="node-title" x="712" y="573">可控与可追溯</text><text class="node-subtitle" x="712" y="595">Risk &amp; cost ↓</text></g>
</svg>
