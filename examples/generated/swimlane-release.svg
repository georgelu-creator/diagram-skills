<svg xmlns="http://www.w3.org/2000/svg" class="diagram-skills" data-theme="light" viewBox="0 0 2072.2 886" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">AI 功能发布泳道</title><desc id="diagram-desc">流程图 / Process Flow with 6 nodes and 6 edges</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="var(--shadow)"/></filter>
<marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-primary)"/></marker>
<marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-control)"/></marker>
<marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-feedback)"/></marker>
<marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-async)"/></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-success)"/></marker>
<marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-error)"/></marker>
</defs>
<style>
.diagram-skills{--page:#F8FAFC;--surface:#FFFFFF;--ink:#172033;--muted:#667085;--hair:#D7E0EA;--group:#EFF6FF;--group_stroke:#93C5FD;--shadow:#0f172a18;--node-process:#FFFFFF;--node-process-stroke:#D7E0EA;--node-decision:#FFFFFF;--node-decision-stroke:#D7E0EA;--node-input:#FFFFFF;--node-input-stroke:#D7E0EA;--node-document:#FFFFFF;--node-document-stroke:#D7E0EA;--node-database:#FFFFFF;--node-database-stroke:#D7E0EA;--node-agent:#FFFFFF;--node-agent-stroke:#D7E0EA;--node-external:#FFFFFF;--node-external-stroke:#D7E0EA;--group-tone-0:#EFF6FF;--group-tone-1:#EFF6FF;--group-tone-2:#EFF6FF;--group-tone-3:#EFF6FF;--group-tone-4:#EFF6FF;--group-tone-5:#EFF6FF;--edge-primary:#4F46E5;--edge-control:#ea580c;--edge-feedback:#7c3aed;--edge-async:#64748b;--edge-success:#059669;--edge-error:#dc2626;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page)}}
.diagram-skills[data-theme="dark"]{--page:#0c1117;--surface:#151b23;--ink:#f8fafc;--muted:#a8b3c2;--hair:#334155;--group:#16253a;--group_stroke:#42648f;--shadow:#00000055;--node-process:#151b23;--node-process-stroke:#334155;--node-decision:#151b23;--node-decision-stroke:#334155;--node-input:#151b23;--node-input-stroke:#334155;--node-document:#151b23;--node-document-stroke:#334155;--node-database:#151b23;--node-database-stroke:#334155;--node-agent:#151b23;--node-agent-stroke:#334155;--node-external:#151b23;--node-external-stroke:#334155;--group-tone-0:#16253a;--group-tone-1:#16253a;--group-tone-2:#16253a;--group-tone-3:#16253a;--group-tone-4:#16253a;--group-tone-5:#16253a}
text{fill:var(--ink)}.page-bg{fill:var(--page)}.title{font-size:25px;font-weight:800}.subtitle{font-size:12.5px;fill:var(--muted)}.type-badge{font-size:10px;font-weight:800;fill:var(--muted);letter-spacing:.4px}.type-badge-bg{fill:var(--surface);stroke:var(--hair)}
.lane-box{fill:var(--surface);stroke:var(--hair);stroke-width:1.1}.lane:nth-child(even) .lane-box{fill:var(--group)}.lane-title{font-size:12px;font-weight:850;fill:var(--muted);letter-spacing:.45px}.group-box{fill:var(--group);stroke:var(--group-stroke);stroke-width:1.2}.group.tone-0 .group-box{fill:var(--group-tone-0)}.group.tone-1 .group-box{fill:var(--group-tone-1)}.group.tone-2 .group-box{fill:var(--group-tone-2)}.group.tone-3 .group-box{fill:var(--group-tone-3)}.group.tone-4 .group-box{fill:var(--group-tone-4)}.group.tone-5 .group-box{fill:var(--group-tone-5)}.group-title{font-size:12px;font-weight:800;fill:var(--muted);letter-spacing:.5px}
.node-shape{stroke-width:1.25;filter:url(#shadow)}.node-shape.process{fill:var(--node-process);stroke:var(--node-process-stroke)}.node-shape.decision{fill:var(--node-decision);stroke:var(--node-decision-stroke)}.node-shape.input{fill:var(--node-input);stroke:var(--node-input-stroke)}.node-shape.document{fill:var(--node-document);stroke:var(--node-document-stroke)}.node-shape.database{fill:var(--node-database);stroke:var(--node-database-stroke)}.node-shape.agent{fill:var(--node-agent);stroke:var(--node-agent-stroke);stroke-width:1.7}.node-shape.external{fill:var(--node-external);stroke:var(--node-external-stroke);stroke-dasharray:6 4}.agent-inner{fill:none;stroke:var(--node-agent-stroke);stroke-width:.8;opacity:.55}.node-detail{fill:none;stroke:var(--hair);stroke-width:1.1}
.node-title{font-size:14.5px;font-weight:750;text-anchor:middle;dominant-baseline:middle}.node-subtitle{font-size:11.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.edge{fill:none;stroke-linecap:round;stroke-linejoin:round}.edge-label-bg{fill:var(--page);stroke:var(--hair);stroke-width:.7;opacity:.97}.edge-label{font-size:10.8px;font-weight:650;text-anchor:middle;dominant-baseline:middle;fill:var(--muted)}
.legend-bg{fill:var(--surface);stroke:var(--hair)}.legend-text{font-size:10.5px;fill:var(--muted)}.node-link{cursor:pointer}.node-link:focus .node-shape,.node-link:hover .node-shape{stroke:var(--edge-primary);stroke-width:2.4}.node-link:focus{outline:none}
</style>
<rect class="page-bg" width="2072.2" height="886"/>
<text class="title" x="72" y="48">AI 功能发布泳道</text>
<text class="subtitle" x="72" y="75">从业务意图到可审计发布 · Ownership + Manual Rank</text>
<g class="diagram-type"><rect class="type-badge-bg" x="1858.6" y="31" width="141.6" height="25" rx="12.5"/><text class="type-badge" x="1929.4" y="47" text-anchor="middle">流程图 / Process Flow</text></g>
<g class="lane"><rect class="lane-box" x="50" y="118" width="1972.2" height="168" rx="14"/><text class="lane-title" x="65" y="143">产品 / PRODUCT</text></g>
<g class="lane"><rect class="lane-box" x="50" y="300" width="1972.2" height="202" rx="14"/><text class="lane-title" x="65" y="325">安全与合规 / SECURITY</text></g>
<g class="lane"><rect class="lane-box" x="50" y="516" width="1972.2" height="168" rx="14"/><text class="lane-title" x="65" y="541">研发与平台 / ENGINEERING</text></g>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 286.8 229 L 345.8 229 L 404.8 229" marker-end="url(#arrow-primary)"/>
<path class="edge control" style="stroke:var(--edge-control)" stroke-width="1.8" stroke-dasharray="7 3" d="M 630.4 229 L 689.4 229 L 689.4 428 L 748.4 428" marker-end="url(#arrow-control)"/>
<path class="edge success" style="stroke:var(--edge-success)" stroke-width="2.7" d="M 980.2 428 L 1039.2 428 L 1039.2 627 L 1098.2 627" marker-end="url(#arrow-success)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" stroke-width="2" d="M 1317.6 627 L 1376.6 627 L 1435.6 627" marker-end="url(#arrow-primary)"/>
<path class="edge success" style="stroke:var(--edge-success)" stroke-width="2.7" d="M 1648.8 627 L 1707.8 627 L 1707.8 229 L 1766.8 229" marker-end="url(#arrow-success)"/>
<path class="edge feedback" style="stroke:var(--edge-feedback)" stroke-width="2.1" stroke-dasharray="10 4" d="M 1648.8 627 L 2014.2 627 L 2014.2 704 L 1070.2 704 L 1070.2 627 L 1098.2 627" marker-end="url(#arrow-feedback)"/>
<g class="node" id="node-intent"><path class="node-shape input" d="M 104 190 H 286.8 L 268.8 268 H 86 Z"/><text class="node-title" x="186.4" y="219">业务意图</text><text class="node-subtitle" x="186.4" y="241">Goal · Audience · Risk</text></g>
<g class="node" id="node-brief"><path class="node-shape document" d="M 404.8 190 H 612.4 L 630.4 208 V 259 Q 517.6 275 404.8 259 Z"/><path class="node-detail" d="M 612.4 190 V 208 H 630.4"/><text class="node-title" x="517.6" y="219">发布简报</text><text class="node-subtitle" x="517.6" y="241">Scope · Acceptance criteria</text></g>
<g class="node" id="node-gate"><path class="node-shape decision" d="M 864.3 372 L 980.2 428 L 864.3 484 L 748.4 428 Z"/><text class="node-title" x="864.3" y="418">风险可接受？</text><text class="node-subtitle" x="864.3" y="440">Privacy · Security · Policy</text></g>
<g class="node" id="node-build"><rect class="node-shape process" x="1098.2" y="588" width="219.4" height="78" rx="13"/><text class="node-title" x="1207.9" y="617">实现与集成</text><text class="node-subtitle" x="1207.9" y="639">Code · Config · Migration</text></g>
<g class="node" id="node-verify"><rect class="node-shape process" x="1435.6" y="588" width="213.2" height="78" rx="13"/><text class="node-title" x="1542.2" y="617">验证与证据</text><text class="node-subtitle" x="1542.2" y="639">Tests · Audit · Rollback</text></g>
<g class="node" id="node-release"><rect class="node-shape process" x="1766.8" y="190" width="219.4" height="78" rx="13"/><text class="node-title" x="1876.5" y="219">分阶段发布</text><text class="node-subtitle" x="1876.5" y="241">Canary · Observe · Expand</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="663.5" y="318.5" width="51.8" height="20" rx="7"/><text class="edge-label" x="689.4" y="328.5">review</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="1019.6" y="517.5" width="39.2" height="20" rx="7"/><text class="edge-label" x="1039.2" y="527.5">批准</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="1688.2" y="418" width="39.2" height="20" rx="7"/><text class="edge-label" x="1707.8" y="428">通过</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="1522.6" y="686" width="39.2" height="20" rx="7"/><text class="edge-label" x="1542.2" y="696">修正</text></g>
<g class="legend"><rect class="legend-bg" x="728.1" y="820" width="616" height="36" rx="12"/>
<path d="M 746.1 838 H 770.1" stroke="var(--edge-primary)" stroke-width="2"/><text class="legend-text" x="778.1" y="842">Primary flow</text>
<path d="M 894.1 838 H 918.1" stroke="var(--edge-control)" stroke-width="1.8" stroke-dasharray="7 3"/><text class="legend-text" x="926.1" y="842">Control / trigger</text>
<path d="M 1042.1 838 H 1066.1" stroke="var(--edge-success)" stroke-width="2.7"/><text class="legend-text" x="1074.1" y="842">Success branch</text>
<path d="M 1190.1 838 H 1214.1" stroke="var(--edge-feedback)" stroke-width="2.1" stroke-dasharray="10 4"/><text class="legend-text" x="1222.1" y="842">Feedback / iteration</text>
</g>
</svg>
