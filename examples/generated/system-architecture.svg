<svg xmlns="http://www.w3.org/2000/svg" class="abi-flow" data-theme="light" viewBox="0 0 960 1138" role="img" aria-labelledby="abi-title abi-desc">
<title id="abi-title">企业 AI 工作系统架构</title><desc id="abi-desc">系统架构图 / System Architecture with 8 nodes and 9 edges</desc>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="var(--shadow)"/></filter>
<marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-error)"/></marker>
<marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-primary)"/></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-success)"/></marker>
<marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-feedback)"/></marker>
<marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-async)"/></marker>
<marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--edge-control)"/></marker>
</defs>
<style>
.abi-flow{--page:#ffffff;--surface:#ffffff;--ink:#172033;--muted:#526071;--hair:#d7e0ea;--group:#f8fafc;--group_stroke:#c7d2e0;--shadow:#31537a18;--node-document:#f0fdf4;--node-document-stroke:#4ade80;--node-process:#eff6ff;--node-process-stroke:#60a5fa;--node-external:#f8fafc;--node-external-stroke:#94a3b8;--node-input:#fdf4ff;--node-input-stroke:#d946ef;--node-agent:#f5f3ff;--node-agent-stroke:#8b5cf6;--node-decision:#fff7ed;--node-decision-stroke:#fb923c;--node-database:#ecfeff;--node-database-stroke:#22d3ee;--group-tone-0:#eff6ff;--group-tone-1:#ecfeff;--group-tone-2:#f5f3ff;--group-tone-3:#fff7ed;--group-tone-4:#f0fdf4;--group-tone-5:#fff1f2;--edge-primary:#2563eb;--edge-control:#ea580c;--edge-feedback:#7c3aed;--edge-async:#64748b;--edge-success:#059669;--edge-error:#dc2626;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page)}}
.abi-flow[data-theme="dark"]{--page:#0c1117;--surface:#151b23;--ink:#f8fafc;--muted:#a8b3c2;--hair:#334155;--group:#16253a;--group_stroke:#42648f;--shadow:#00000055;--node-document:#151b23;--node-document-stroke:#334155;--node-process:#151b23;--node-process-stroke:#334155;--node-external:#151b23;--node-external-stroke:#334155;--node-input:#151b23;--node-input-stroke:#334155;--node-agent:#151b23;--node-agent-stroke:#334155;--node-decision:#151b23;--node-decision-stroke:#334155;--node-database:#151b23;--node-database-stroke:#334155;--group-tone-0:#16253a;--group-tone-1:#16253a;--group-tone-2:#16253a;--group-tone-3:#16253a;--group-tone-4:#16253a;--group-tone-5:#16253a}
text{fill:var(--ink)}.page-bg{fill:var(--page)}.title{font-size:25px;font-weight:800}.subtitle{font-size:12.5px;fill:var(--muted)}.type-badge{font-size:10px;font-weight:800;fill:var(--muted);letter-spacing:.4px}.type-badge-bg{fill:var(--surface);stroke:var(--hair)}
.group-box{fill:var(--group);stroke:var(--group-stroke);stroke-width:1.2}.group.tone-0 .group-box{fill:var(--group-tone-0)}.group.tone-1 .group-box{fill:var(--group-tone-1)}.group.tone-2 .group-box{fill:var(--group-tone-2)}.group.tone-3 .group-box{fill:var(--group-tone-3)}.group.tone-4 .group-box{fill:var(--group-tone-4)}.group.tone-5 .group-box{fill:var(--group-tone-5)}.group-title{font-size:12px;font-weight:800;fill:var(--muted);letter-spacing:.5px}
.node-shape{stroke-width:1.25;filter:url(#shadow)}.node-shape.process{fill:var(--node-process);stroke:var(--node-process-stroke)}.node-shape.decision{fill:var(--node-decision);stroke:var(--node-decision-stroke)}.node-shape.input{fill:var(--node-input);stroke:var(--node-input-stroke)}.node-shape.document{fill:var(--node-document);stroke:var(--node-document-stroke)}.node-shape.database{fill:var(--node-database);stroke:var(--node-database-stroke)}.node-shape.agent{fill:var(--node-agent);stroke:var(--node-agent-stroke);stroke-width:1.7}.node-shape.external{fill:var(--node-external);stroke:var(--node-external-stroke);stroke-dasharray:6 4}.agent-inner{fill:none;stroke:var(--node-agent-stroke);stroke-width:.8;opacity:.55}.node-detail{fill:none;stroke:var(--hair);stroke-width:1.1}
.node-title{font-size:14.5px;font-weight:750;text-anchor:middle;dominant-baseline:middle}.node-subtitle{font-size:11.5px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.edge{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.edge.async,.edge.error{stroke-dasharray:6 5}.edge.feedback{stroke-width:2.2}.edge-label-bg{fill:var(--page);stroke:var(--hair);stroke-width:.7;opacity:.97}.edge-label{font-size:10.8px;font-weight:650;text-anchor:middle;dominant-baseline:middle;fill:var(--muted)}
.legend-bg{fill:var(--surface);stroke:var(--hair)}.legend-text{font-size:10.5px;fill:var(--muted)}.node-link{cursor:pointer}.node-link:focus .node-shape,.node-link:hover .node-shape{stroke:var(--edge-primary);stroke-width:2.4}.node-link:focus{outline:none}
</style>
<rect class="page-bg" width="960" height="1138"/>
<text class="title" x="72" y="48">企业 AI 工作系统架构</text>
<text class="subtitle" x="72" y="75">从多端接入、统一编排到长期记忆与可信资产沉淀</text>
<g class="diagram-type"><rect class="type-badge-bg" x="684.8" y="31" width="203.2" height="25" rx="12.5"/><text class="type-badge" x="786.4" y="47" text-anchor="middle">系统架构图 / System Architecture</text></g>
<g class="group tone-0"><rect class="group-box" x="227" y="80" width="506" height="140" rx="16"/><text class="group-title" x="241" y="101">终端 / USERS &amp; AGENTS</text></g>
<g class="group tone-1"><rect class="group-box" x="340.1" y="276" width="279.8" height="140" rx="16"/><text class="group-title" x="354.1" y="297">接入与编排 / ORCHESTRATION</text></g>
<g class="group tone-2"><rect class="group-box" x="221" y="472" width="518" height="150" rx="16"/><text class="group-title" x="235" y="493">核心能力 / CORE CAPABILITIES</text></g>
<g class="group tone-3"><rect class="group-box" x="211.5" y="678" width="537" height="150" rx="16"/><text class="group-title" x="225.5" y="699">可信资产 / SOURCES OF TRUTH</text></g>
<g class="group tone-4"><rect class="group-box" x="349.4" y="884" width="261.2" height="140" rx="16"/><text class="group-title" x="363.4" y="905">治理闭环 / GOVERNANCE</text></g>
<path class="edge primary" style="stroke:var(--edge-primary)" d="M 351.4 196 L 351.4 255 L 480 255 L 480 314" marker-end="url(#arrow-primary)"/>
<path class="edge control" style="stroke:var(--edge-control)" d="M 602.4 196 L 602.4 255 L 480 255 L 480 314" marker-end="url(#arrow-control)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" d="M 480 392 L 480 451 L 364 451 L 364 510" marker-end="url(#arrow-primary)"/>
<path class="edge control" style="stroke:var(--edge-control)" d="M 480 392 L 480 453.5 L 621 453.5 L 621 515" marker-end="url(#arrow-control)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" d="M 364 598 L 364 657 L 354.5 657 L 354.5 716" marker-end="url(#arrow-primary)"/>
<path class="edge async" style="stroke:var(--edge-async)" d="M 621 593 L 621 657 L 621 721" marker-end="url(#arrow-async)"/>
<path class="edge primary" style="stroke:var(--edge-primary)" d="M 354.5 804 L 354.5 863 L 480 863 L 480 922" marker-end="url(#arrow-primary)"/>
<path class="edge async" style="stroke:var(--edge-async)" d="M 621 799 L 621 860.5 L 480 860.5 L 480 922" marker-end="url(#arrow-async)"/>
<path class="edge feedback" style="stroke:var(--edge-feedback)" d="M 480 1000 L 480 1028 L 762.5 1028 L 762.5 286 L 480 286 L 480 314" marker-end="url(#arrow-feedback)"/>
<g class="node" id="node-human"><rect class="node-shape external" x="251" y="118" width="200.8" height="78" rx="13"/><text class="node-title" x="351.4" y="147">多端用户</text><text class="node-subtitle" x="351.4" y="169">Mobile · Desktop · Web</text></g>
<g class="node" id="node-agents"><rect class="node-shape agent" x="495.8" y="118" width="213.2" height="78" rx="13"/><rect class="agent-inner" x="500.8" y="123" width="203.2" height="68" rx="9"/><text class="node-title" x="602.4" y="147">AI Agents</text><text class="node-subtitle" x="602.4" y="169">ChatGPT · Codex · Claude</text></g>
<g class="node" id="node-gateway"><rect class="node-shape process" x="364.1" y="314" width="231.8" height="78" rx="13"/><text class="node-title" x="480" y="343">统一接入网关</text><text class="node-subtitle" x="480" y="365">Auth · Permission · Routing</text></g>
<g class="node" id="node-memory"><path class="node-shape database" d="M 245 522 C 245 508 483 508 483 522 V 586 C 483 600 245 600 245 586 Z"/><ellipse class="node-detail" cx="364" cy="522" rx="119" ry="12"/><text class="node-title" x="364" y="547">记忆与上下文</text><text class="node-subtitle" x="364" y="569">Search · Context · Relations</text></g>
<g class="node" id="node-tools"><rect class="node-shape agent" x="527" y="515" width="188" height="78" rx="13"/><rect class="agent-inner" x="532" y="520" width="178" height="68" rx="9"/><text class="node-title" x="621" y="544">工具编排</text><text class="node-subtitle" x="621" y="566">MCP · API · Actions</text></g>
<g class="node" id="node-github"><path class="node-shape database" d="M 235.5 728 C 235.5 714 473.5 714 473.5 728 V 792 C 473.5 806 235.5 806 235.5 792 Z"/><ellipse class="node-detail" cx="354.5" cy="728" rx="119" ry="12"/><text class="node-title" x="354.5" y="753">工程资产</text><text class="node-subtitle" x="354.5" y="775">Code · Skill · Prompt · SOP</text></g>
<g class="node" id="node-workspace"><path class="node-shape document" d="M 517.5 721 H 706.5 L 724.5 739 V 790 Q 621 806 517.5 790 Z"/><path class="node-detail" d="M 706.5 721 V 739 H 724.5"/><text class="node-title" x="621" y="750">业务资料</text><text class="node-subtitle" x="621" y="772">Docs · Drive · Database</text></g>
<g class="node" id="node-audit"><rect class="node-shape process" x="373.4" y="922" width="213.2" height="78" rx="13"/><text class="node-title" x="480" y="951">审计与学习闭环</text><text class="node-subtitle" x="480" y="973">Trace · Review · Improve</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="386.65" y="237" width="58.1" height="20" rx="7"/><text class="edge-label" x="415.7" y="247">request</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="515.3" y="237" width="51.8" height="20" rx="7"/><text class="edge-label" x="541.2" y="247">invoke</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="392.95" y="433" width="58.1" height="20" rx="7"/><text class="edge-label" x="422" y="443">context</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="530.9" y="435.5" width="39.2" height="20" rx="7"/><text class="edge-label" x="550.5" y="445.5">task</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="328.65" y="617.5" width="70.7" height="20" rx="7"/><text class="edge-label" x="364" y="627.5">knowledge</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="588.8" y="679" width="64.4" height="20" rx="7"/><text class="edge-label" x="621" y="689">artifact</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="388.2" y="845" width="58.1" height="20" rx="7"/><text class="edge-label" x="417.25" y="855">version</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="518.3" y="842.5" width="64.4" height="20" rx="7"/><text class="edge-label" x="550.5" y="852.5">evidence</text></g>
<g class="edge-label-group"><rect class="edge-label-bg" x="714.55" y="647" width="95.9" height="20" rx="7"/><text class="edge-label" x="762.5" y="657">policy update</text></g>
<g class="legend"><rect class="legend-bg" x="172" y="1072" width="616" height="36" rx="12"/>
<path d="M 190 1090 H 214" stroke="var(--edge-primary)" stroke-width="2"/><text class="legend-text" x="222" y="1094">Primary flow</text>
<path d="M 338 1090 H 362" stroke="var(--edge-control)" stroke-width="2"/><text class="legend-text" x="370" y="1094">Control / trigger</text>
<path d="M 486 1090 H 510" stroke="var(--edge-async)" stroke-width="2" stroke-dasharray="6 5"/><text class="legend-text" x="518" y="1094">Async / event</text>
<path d="M 634 1090 H 658" stroke="var(--edge-feedback)" stroke-width="2"/><text class="legend-text" x="666" y="1094">Feedback / iteration</text>
</g>
</svg>
