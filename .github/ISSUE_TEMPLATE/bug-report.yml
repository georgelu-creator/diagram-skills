name: Bug report
description: Report a reproducible renderer, Skill, example, or Studio defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove private system details, credentials, and confidential diagram content before submitting.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Installed Agent Skill
        - DiagramSpec CLI
        - Generated SVG / HTML / PNG
        - VisualSkills Studio
        - Examples or documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe source, exact command, and observed output.
      placeholder: Steps, command, and a redacted JSON sample
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python or Node version, browser, and PNG rasterizer when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private URLs, personal data, and confidential architecture details.
          required: true
