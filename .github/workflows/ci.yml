name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Strict example and template validation
        run: |
          python3 skills/abi-flow/scripts/abi_flow.py validate examples/aurora-resilience-network.json --strict
          python3 skills/abi-flow/scripts/abi_flow.py validate examples/swimlane-release.json --strict
          python3 skills/abi-flow/scripts/abi_flow.py workspace-validate examples/enterprise-ai-workspace.json --strict
          for spec in skills/abi-flow/templates/*.json; do
            python3 skills/abi-flow/scripts/abi_flow.py validate "$spec" --strict
          done
      - name: Render example
        run: python3 skills/abi-flow/scripts/abi_flow.py render examples/aurora-resilience-network.json --output-dir /tmp/abi-flow --name aurora-resilience-network --strict

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
