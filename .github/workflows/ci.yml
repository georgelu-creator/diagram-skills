name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Strict example validation
        run: python3 skills/abi-flow/scripts/abi_flow.py validate examples/aurora-resilience-network.json --strict
      - name: Render example
        run: python3 skills/abi-flow/scripts/abi_flow.py render examples/aurora-resilience-network.json --output-dir /tmp/abi-flow --name aurora-resilience-network --strict
